name: Full Render

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: projects/<project_id>/ to render
        required: true
        type: string
      candidate_ref:
        description: Immutable 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: full-render-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
    steps:
      - name: Validate immutable candidate and project identifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]] || { echo "Invalid project_id"; exit 1; }
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate_ref must be an immutable 40-character commit SHA"; exit 1; }

      - name: Checkout immutable candidate without implicit LFS pull
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          lfs: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          [ "$ACTUAL" = "$CANDIDATE_REF" ] || { echo "Checked out $ACTUAL instead of $CANDIDATE_REF"; exit 1; }
          echo "RENDER_SOURCE_COMMIT=$ACTUAL" >> "$GITHUB_ENV"

      - name: Fetch and verify Git LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          for attempt in 1 2 3; do
            if git lfs fetch --all && git lfs checkout; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          git lfs fsck

      - name: Resolve approved proof run
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          APPROVAL="projects/$PROJECT_ID/direction/proof_approval.json"
          test -f "$APPROVAL" || { echo "Proof approval is missing"; exit 1; }
          RUN_ID="$(jq -r '.proof_run_id' "$APPROVAL")"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid proof_run_id"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact approved proof bundle
        uses: actions/download-artifact@v6
        with:
          name: proof-${{ steps.approval.outputs.run_id }}
          run-id: ${{ steps.approval.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/approved-proof

      - name: Restore approved prefix assets, narration, and captions
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="/tmp/approved-proof/projects/$PROJECT_ID"
          test -d "$SOURCE" || { echo "Approved proof bundle project path missing"; find /tmp/approved-proof -maxdepth 4 -type f; exit 1; }
          mkdir -p "projects/$PROJECT_ID/assets/captures/variants" "projects/$PROJECT_ID/assets/graphics/generated" "projects/$PROJECT_ID/assets/music" "projects/$PROJECT_ID/build" "projects/$PROJECT_ID/direction"
          cp -a "$SOURCE/assets/captures/variants/." "projects/$PROJECT_ID/assets/captures/variants/" 2>/dev/null || true
          cp -a "$SOURCE/assets/graphics/generated/." "projects/$PROJECT_ID/assets/graphics/generated/" 2>/dev/null || true
          cp -a "$SOURCE/assets/music/." "projects/$PROJECT_ID/assets/music/" 2>/dev/null || true
          cp "$SOURCE/build/narration_final.wav" "projects/$PROJECT_ID/build/narration_final.wav"
          cp "$SOURCE/build/captions.json" "projects/$PROJECT_ID/build/captions.json"
          cp "$SOURCE/build/captions.srt" "projects/$PROJECT_ID/build/captions.srt"
          cp "$SOURCE/direction/word_alignment.json" "projects/$PROJECT_ID/direction/word_alignment.json"

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Use Python for rendered speech QA
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @remotion/cli@4.0.489
          python -m pip install --requirement requirements-qa.txt
          npx playwright install --with-deps chromium

      - name: Validate canonical plan and timeline
        run: npm run orvyq -- validate --project-id "$PROJECT_ID"

      - name: Materialize immutable external narration and full footage set
        run: npm run orvyq -- materialize-assets --project-id "$PROJECT_ID" --mode full

      - name: Capture active official sources
        run: npm run orvyq -- capture-sources --project-id "$PROJECT_ID"

      - name: Build deterministic visual variants and music cues
        run: npm run orvyq -- prepare-visuals --project-id "$PROJECT_ID" --mode full

      - name: Compile full edit plan from approved narration and captions
        run: npm run orvyq -- compile --project-id "$PROJECT_ID"

      - name: Verify approved prefix and full pre-render readiness
        run: npm run orvyq -- audit --project-id "$PROJECT_ID" --stage full-pre-render

      - name: Stage canonical render assets
        run: npm run orvyq -- stage-render-assets --project-id "$PROJECT_ID"

      - name: Type-check Remotion composition
        run: npm run typecheck:render

      - name: Resolve browser executable
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          [ -n "$BROWSER" ] || { echo "No supported browser found"; exit 1; }
          "$BROWSER" --version
          echo "ORVYQ_BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"

      - name: Render full canonical film
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "projects/$PROJECT_ID/output"
          npx remotion render src/render/index.ts ORVYQVideo "projects/$PROJECT_ID/output/final.mp4" \
            --props="projects/$PROJECT_ID/build/render_input.json" \
            --concurrency=1 \
            --max-retries=3 \
            2>&1 | tee "projects/$PROJECT_ID/qa/full-render.log"

      - name: Transcribe rendered final film
        run: |
          python scripts/transcribe.py \
            --input "projects/$PROJECT_ID/output/final.mp4" \
            --output "projects/$PROJECT_ID/build/final_transcript.json"

      - name: Run rendered media and speech-ending QA
        run: |
          npm run orvyq -- rendered-qa --project-id "$PROJECT_ID" --mode full \
            --video "projects/$PROJECT_ID/output/final.mp4" \
            --transcript "projects/$PROJECT_ID/build/final_transcript.json"
          npm run orvyq -- audit --project-id "$PROJECT_ID" --stage post-render

      - name: Upload final artifact only after every QA passes
        uses: actions/upload-artifact@v6
        with:
          name: final-${{ inputs.project_id }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            projects/${{ inputs.project_id }}/output/final.mp4
            projects/${{ inputs.project_id }}/qa/aggregate.full-pre-render.json
            projects/${{ inputs.project_id }}/qa/aggregate.post-render.json
            projects/${{ inputs.project_id }}/qa/rendered.full.json
            projects/${{ inputs.project_id }}/qa/full-render.log
            projects/${{ inputs.project_id }}/build/final_transcript.json
            projects/${{ inputs.project_id }}/build/mix_metadata.json
            projects/${{ inputs.project_id }}/direction/production_plan.json
            projects/${{ inputs.project_id }}/direction/narration_timeline.json
            projects/${{ inputs.project_id }}/direction/proof_approval.json
            projects/${{ inputs.project_id }}/assets/captures/**/*.provenance.json
            projects/${{ inputs.project_id }}/build/external_assets.full.provenance.json
